services:
  postgres:
    image: postgres:16-alpine
    container_name: eventify-container
    environment:
      POSTGRES_DB: eventify_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - eventify-volume:/var/lib/postgresql/data

volumes:
  eventify-volume: